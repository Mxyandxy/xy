# Render Blueprint —— 后端一键配置
# 用法：Render 控制台 → New → Blueprint → 选仓库 Mxyandxy/xy → 自动读取本文件
# 标了 sync: false 的变量不会写进仓库，需要在 Render 控制台手动填（避免泄露密钥）
services:
  - type: web
    name: campus-forum-api
    runtime: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: IMGBB_API_KEY
        sync: false
